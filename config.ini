# Jarvis-bubble Configuration

[assistant]
name = "Jarvis"
version = "1.0.0"
description = "AI Assistant with smooth functioning and orb visualization"

[orb]
size = 5
animation_speed = 0.1
pulse_intensity = 3

[behavior]
max_history_size = 100
response_timeout = 30
enable_logging = true

[appearance]
use_unicode = true
color_support = true
theme = "default"
